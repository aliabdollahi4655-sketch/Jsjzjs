<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>نمایش عکس</title>
    <style>
        body {
            direction: rtl;
            font-family: Tahoma;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        h2 {
            color: #fff;
            margin-bottom: 15px;
        }

        .image-box {
            width: 280px;
            height: 280px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.3);
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .image-box img:hover {
            transform: scale(1.1);
        }

        .caption {
            margin-top: 12px;
            color: #fff;
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>تصویر نمونه</h2>

    <div class="image-box">
        <img src="photo.jpg" alt="عکس">
    </div>

    <div class="caption">این تصویر از پوشه پروژه نمایش داده شده است</div>
</div>

</body>
</html>
